<style>
/* VOICE: calme, net, scolaire — un outil de travail quotidien
   IDEA: le registre de classe du collège, relié et doré
   PICTURE: l'outil lui-même (appel, grilles, conseil) occupe l'écran
   COLOUR+TYPE: vert profond #0A2E2A, or #D4A017, sarcelle #0D9488, sable ; Playfair Display + DM Sans
   LAYOUT: barre verte, onglets, une colonne de travail jusqu'à 1240px */
:root{color-scheme:light dark;
--bg:light-dark(#F5F3EF,#0b1615);--card:light-dark(#fff,#132422);--ink:light-dark(#0F172A,#E6FAF8);--mute:light-dark(#586578,#9fb3b0);
--line:light-dark(#D6D0C4,#24403c);--green:#0A2E2A;--teal:light-dark(#0D9488,#2dd4bf);--tealbg:light-dark(#CCFBF1,#0f3b36);
--gold:#D4A017;--goldd:light-dark(#92400E,#f5c84c);--goldbg:light-dark(#FEF3C7,#3a2f0b);--red:light-dark(#b91c1c,#f87171);--redbg:light-dark(#fde8e8,#3b1515)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif;overflow-x:clip}
h1,h2{font-family:'Playfair Display',Georgia,serif;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:clamp(24px,3vw,32px)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.primary{background:linear-gradient(135deg,#D4A017,#B8860B);color:#0F172A;border:0}
.teal{background:var(--teal);color:#fff;border:0}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px}
header{background:var(--green);color:#E6FAF8;padding:12px max(4vw,16px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand b{font-family:'Playfair Display',serif;font-size:24px;font-weight:800}
.brand small{display:block;color:var(--gold);letter-spacing:.3em;font-size:11px;font-weight:700}
header select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
header select option{color:#0F172A}
nav{background:var(--green);padding:0 max(4vw,16px);display:flex;gap:4px;overflow-x:auto;border-top:1px solid rgba(255,255,255,.08)}
nav a{flex:none;color:rgba(230,250,248,.75);text-decoration:none;padding:12px 14px;font-weight:600;font-size:15px;white-space:nowrap;border-bottom:3px solid transparent}
nav a[aria-current=page]{color:#fff;border-color:var(--gold)}
main{max-width:1240px;margin:0 auto;padding:clamp(20px,3vw,40px) max(4vw,16px)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.kpi b{display:block;font-family:'Playfair Display',serif;font-size:clamp(28px,4vw,40px);line-height:1}
.kpi span{color:var(--mute);font-size:14px}
.mute{color:var(--mute)}.small{font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--tealbg);color:var(--teal);white-space:nowrap}
.pill.g{background:var(--goldbg);color:var(--goldd)}.pill.r{background:var(--redbg);color:var(--red)}
.banner{border-radius:12px;padding:12px 16px;background:var(--goldbg);color:var(--goldd);font-weight:600;margin-bottom:16px}
.list{display:grid;gap:8px;margin-top:16px}
.stu{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--tealbg);color:var(--teal)}
.stu.absent{border-color:var(--red);background:var(--redbg)}.stu.retard{border-color:var(--gold);background:var(--goldbg)}.stu.sortie{border-color:var(--teal)}
.stu .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stu .act button{padding:8px 12px;font-size:14px}
.obs{font-size:13px;color:var(--mute);margin-top:2px}
.scroll{overflow-x:auto}
.tsticky{overflow:auto;max-height:calc(100vh - 170px);-webkit-overflow-scrolling:touch}
.tsticky{padding:0!important}
.tsticky table{border-collapse:separate;border-spacing:0}
.tsticky td,.tsticky th{padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.tsticky td:first-child,.tsticky th:first-child{min-width:120px;max-width:140px;white-space:normal;border-right:1px solid var(--line)}
.tsticky thead th{position:sticky;top:0;z-index:3;background:var(--card);box-shadow:0 1px 0 var(--line)}
.tsticky tbody td:first-child,.tsticky thead th:first-child{position:sticky;left:0;background:var(--card);z-index:2}
.tsticky thead th:first-child{z-index:4}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--mute);font-size:13px}
td.n,th.n{text-align:right}
td input{width:64px;min-height:36px;padding:6px 8px;text-align:right}
.lo{color:var(--red);font-weight:700}.mid{color:var(--goldd);font-weight:700}.hi{color:var(--teal);font-weight:700}
textarea{width:100%;min-height:72px;resize:none;overflow:hidden}
.appr{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.dialog{position:fixed;inset:0;background:rgba(10,46,42,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dialog .card{width:min(460px,100%)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chips button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:72px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:14px}
.bar i{display:block;height:18px;border-radius:6px;background:var(--teal)}
/* Conseil projeté */
.proj{position:fixed;inset:0;z-index:30;background:linear-gradient(160deg,#0A2E2A,#0D4A44,#0F5E56);color:#E6FAF8;display:flex;flex-direction:column}
.proj header{background:transparent}
.proj .stage{flex:1;overflow:hidden;padding:0 max(4vw,24px) 24px;position:relative}
.proj .inner{will-change:transform}
.proj h1{font-size:clamp(32px,4vw,52px)}
.proj table{font-size:clamp(15px,1.4vw,20px)}
.proj th{color:rgba(230,250,248,.6)}.proj td,.proj th{border-color:rgba(255,255,255,.12);white-space:normal}
.proj .big{font-family:'Playfair Display',serif;font-size:clamp(40px,6vw,80px);color:#E0B020;line-height:1}
.proj .avis{display:inline-block;margin-top:8px;padding:8px 18px;border-radius:12px;background:rgba(212,160,23,.18);color:#f5d36a;font-weight:700;font-size:clamp(18px,2vw,26px)}
.proj .ctrl{display:flex;gap:8px;flex-wrap:wrap;padding:12px max(4vw,24px);background:rgba(0,0,0,.25)}
.proj .ctrl button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
.bulletin{background:#fff;color:#0F172A;max-width:820px;margin:0 auto;padding:40px;border:1px solid #D6D0C4;border-radius:8px}
.bulletin h1{color:#0A2E2A;font-size:28px}
.bulletin th,.bulletin td{white-space:normal;border-color:#D6D0C4}
.note{font-size:13px;color:var(--mute);margin-top:24px}
@media(max-width:600px){.appr{grid-template-columns:1fr}.stu{grid-template-columns:44px minmax(0,1fr)}.stu .act{grid-column:1/-1;justify-content:flex-start}.bulletin{padding:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pcb{min-width:68px;min-height:40px;padding:4px 8px;font-size:13px}
.pcb.p{background:var(--goldbg);color:var(--goldd);border-color:var(--gold)}
.pcb.c{background:var(--redbg);color:var(--red);border-color:var(--red)}
.sea{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sea.done b{text-decoration:line-through;opacity:.6}
.prog{height:8px;border-radius:6px;background:var(--tealbg);overflow:hidden}.prog i{display:block;height:100%;background:var(--teal)}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,280px) minmax(0,1fr)}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.pj{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;gap:8px}
.pj.on{background:var(--teal);color:#fff;border-color:var(--teal)}
select.cs{width:60px;padding:6px 8px;min-height:36px}
.lv1{color:var(--red);font-weight:700}.lv2{color:var(--goldd);font-weight:700}.lv3{color:var(--teal);font-weight:700}.lv4{color:var(--teal);font-weight:800}
body.ecran>header,body.ecran>nav,body.ecran>main{display:none}
</style>
</head>

<script>
{
// ---------- Données fictives ----------
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const PRENOMS=['Adam','Inès','Yanis','Lina','Ilyes','Sarah','Rayan','Maryam','Nassim','Aya','Bilal','Hana','Idriss','Salma','Ayoub','Nour','Mehdi','Yasmine','Sami','Kenza','Anas','Lyna','Omar','Myriam'];

const E=PRENOMS.map((p,i)=>({id:i,p,n:NOMS[i],base:6+rnd()*13,beh:rnd()}));

const OBS=E.map(e=>{const a=[];const np=Math.floor(rnd()*4),nn=Math.floor(e.beh<.25?2+rnd()*4:rnd()*2);for(let k=0;k<np;k++)a.push({pol:'+',t:['Participation active','Travail soigné','Aide un camarade'][k%3],m:MATIERES[Math.floor(rnd()*6)].n});for(let k=0;k<nn;k++)a.push({pol:'-',t:['Bavardages','Oubli de matériel','Travail non fait'][k%3],m:MATIERES[Math.floor(rnd()*6)].n});return a});
const ABS=E.map(e=>({dj:Math.floor(rnd()*rnd()*8),ret:Math.floor(rnd()*rnd()*6),tel:e.beh<.2?Math.floor(1+rnd()*3):0}));

let S={role:'prof',appel:{},tels:{},telInc:{},mat:'ma',sel:0,conseil:{},proj:false,projI:0,auto:true};
E.forEach(e=>{S.appel[e.id]={st:'present',palier:0,arr:'',sortie:'',obs:[],t:''};S.tels[e.id]={st:'',dep:'',ret:''}});
try{const r=localStorage.getItem('lc-role');if(r)S.role=r}catch(err){}
// ---------- Réglages et données des nouveaux modules ----------
const CFG={appelDelai:30,alerteVS:15,palier:5,enc:10,proche:0.5,compl:14,felic:16,felicMin:10,eloge:18,elogeMin:16,cycleN:6,cycleNiv:3,telSeuil:3,telHeure:'16:30',maxJour:6,rang:true,publie:true};
const SOCLE=['Langue française à l’oral et à l’écrit','Langues étrangères et régionales','Langages mathématiques, scientifiques et informatiques','Langages des arts et du corps','Méthodes et outils pour apprendre','Formation de la personne et du citoyen','Systèmes naturels et systèmes techniques','Représentations du monde et activité humaine'];
const NIV=['Maîtrise insuffisante','Maîtrise fragile','Maîtrise satisfaisante','Très bonne maîtrise'];
const COMP=E.map(e=>SOCLE.map(()=>Math.max(1,Math.min(4,Math.round(e.base/19*3+1+(rnd()-.5)*1.6)))));
const DAYS=['Lun','Mar','Mer','Jeu','Ven'],SL=['8h','9h','10h','11h','14h','15h','16h'];
const okSlot=(d,s)=>!(d===2&&s>=4);
const CLS=['6A','5A','4A'];
const HRS={fr:4,ma:4,hg:3,an:3,sv:2,ep:2};
const TP={fr:{'0-0':'p','4-4':'p'},ma:{'1-0':'p','3-4':'c','3-5':'c','3-6':'c'},hg:{'4-4':'c','4-5':'c','4-6':'c','0-0':'p'},an:{'2-3':'p','0-6':'p'},sv:{'1-4':'c','1-5':'c'},ep:{'0-0':'c','2-3':'p'}};
let EDT=null;
const UNIT={fr:'Séquence',hg:'Chapitre',an:'Unité',ma:'Chapitre',sv:'Chapitre',ep:'Cycle'};
const FIELD={fr:'Texte support',hg:'Documents',an:'Support (audio, texte)',ma:'Exercices du manuel',sv:'Matériel de manipulation',ep:'Matériel et sécurité'};
const sea=(t,o,d,f,c,done)=>({t,o,d,f,c,done:!!done});
const PED={hg:[],an:[],sv:[],
 fr:[{t:'Le roman d’aventures',per:'Sept. – Nov.',s:[sea('Lecture : incipit','Repérer les personnages',55,'Texte p. 12',1,1),sea('Atelier d’écriture','Rédiger un portrait',55,'Fiche méthode',1,0)]}],
 ma:[{t:'Fractions et proportionnalité',per:'Sept. – Oct.',s:[sea('Fractions équivalentes','Simplifier et comparer',55,'p. 24 n°3 à 8',3,1),sea('Additions de fractions','Même dénominateur puis différents',55,'p. 28',3,1),sea('Proportionnalité','Reconnaître un tableau',55,'p. 40',3,0)]},{t:'Équations',per:'Nov. – Déc.',s:[sea('Résoudre ax+b=c','Isoler l’inconnue',55,'p. 60',5,0),sea('Mise en équation','Traduire un problème',55,'p. 64',3,0)]}],
 ep:[{t:'Athlétisme : le relais',per:'Sept. – Oct.',s:[sea('Course de vitesse','Départ et transmission',110,'Plots, témoins, chronomètres',4,1),sea('Relais 4x50','Zone de transmission',110,'Plots, témoins',6,1),sea('Évaluation','Barème du relais',110,'Feuille de barème',4,0)]},{t:'Basket',per:'Nov. – Déc.',s:[sea('Passes et démarquage','Jouer sans ballon',110,'Ballons, chasubles',4,0),sea('Jeu à 3 contre 3','Créer le surnombre',110,'Ballons, plots',6,0)]}]};

 pp:['accueil','appel','telephones','notes','appreciations','competences','conseil','bulletins','edt','pedago'],

const NAMES={prof:'M. Benali',pp:'M. Hachemi',vs:'vie scolaire',dir:'Monsieur le directeur'};
const CARDS=[['appel','Faire l’appel','Tous présents par défaut, retards par paliers, observations multiples.'],['viesco','Vie scolaire','Justificatifs, punitions, sanctions, fil de la journée.'],['appreciations','Saisir les appréciations','Proposition automatique modifiable, compteurs d’observations.'],['competences','Compétences de cycle','Socle commun et validation du cycle.'],['conseil','Préparer le conseil','Avis proposés, projection, mode 2 écrans.'],['edt','Emploi du temps','Contraintes, souhaits, générateur.'],['pedago','Mon espace pédagogique','Cycles, séances, planning.'],['reglages','Réglages','Seuils, coefficients, droits.']];

// ---------- Utilitaires ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ini=e=>e.p[0]+e.n[0];
function moyMat(mid,i){let s=0,c=0;for(const ev of EVALS[mid]){const v=ev.notes[i];if(typeof v==='number'){s+=v*20/ev.b*ev.c;c+=ev.c}}return c?s/c:null}
function moyGen(i){let s=0,c=0;for(const m of MATIERES){const v=moyMat(m.id,i);if(v!=null){s+=v*m.c;c+=m.c}}return c?s/c:null}
function moyClasse(mid){const a=E.map(e=>moyMat(mid,e.id)).filter(v=>v!=null);return a.reduce((x,y)=>x+y,0)/a.length}
function avis(i){const g=moyGen(i),ms=MATIERES.map(m=>moyMat(m.id,i)).filter(v=>v!=null);const mn=Math.min(...ms);
 if(g>CFG.eloge&&mn>CFG.elogeMin)return{a:'Éloges',k:'hi',w:''};
 if(g>CFG.felic&&mn>CFG.felicMin)return{a:'Félicitations',k:'hi',w:g>CFG.eloge?`Éloges non retenus : une matière sous ${CFG.elogeMin}`:''};
 if(g>=CFG.compl)return{a:'Compliments',k:'hi',w:g>CFG.felic?`Félicitations non retenues : une matière sous ${CFG.felicMin}`:''};
 if(g>=CFG.enc+CFG.proche)return{a:'Encouragements',k:'',w:''};
 if(g>=CFG.enc)return{a:'Encouragements ou avertissement',k:'mid',w:'Proche du seuil : à discuter en conseil'};
 return{a:'Avertissement à discuter',k:'lo',w:'Travail, comportement ou les deux, selon le conseil'}}

function proposer(mid,i){const c=obsCount(i),e=E[i];const g=moyGen(i);const v=mid==='all'?g:moyMat(mid,i);
 let t=v>=16?`Excellent trimestre. ${e.p} maîtrise les notions et fait preuve de rigueur.`:v>=13?`Bon trimestre. ${e.p} est sérieux(se) et obtient des résultats solides.`:v>=10?`Trimestre correct. ${e.p} doit approfondir son travail personnel pour progresser.`:`Trimestre difficile. ${e.p} doit fournir un travail plus régulier et ne pas hésiter à demander de l'aide.`;
 if(mid==='all')t=g>=14?`Très bon trimestre dans l'ensemble. Les professeurs saluent le sérieux de ${e.p}. Continuez ainsi.`:g>=10?`Trimestre satisfaisant. ${e.p} peut viser plus haut avec davantage de régularité.`:`Trimestre insuffisant. ${e.p} doit se remobiliser dans toutes les matières dès la rentrée.`;
 if(c.n>=3)t+=' Le comportement en classe doit s\'améliorer.';else if(c.p>=2)t+=' Une participation appréciée.';return t}
function corriger(t){return t.replace(/\s+/g,' ').replace(/\s+([,.])/g,'$1').replace(/\s*([!?;:])/g,' $1').replace(/^./,c=>c.toUpperCase()).replace(/([.!?]) +(\p{Ll})/gu,(a,p,c)=>p+' '+c.toUpperCase()).replace(/ i /g,' il ').replace(/\btravaile\b/g,'travaille').replace(/\bdoit faire des efforts\b/g,'doit fournir des efforts').trim().replace(/([^.!?])$/,'$1.')}

// --- Emploi du temps : générateur ---
function genEDT(){
 const units=[];CLS.forEach(c=>MATIERES.forEach(m=>{for(let k=0;k<HRS[m.id];k++)units.push({c,m:m.id})}));
 let best=null;
 for(let t=0;t<250;t++){
  const g={},tb={},cd={},td={};
  const ord=units.map(u=>({u,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.u);
  let ok=true;
  for(const {c,m} of ord){
   let bs=1e9,bk=null;
   for(let d=0;d<5;d++)for(let s=0;s<7;s++){
    if(!okSlot(d,s))continue;
    const kc=`${c}-${d}-${s}`,kt=`${m}-${d}-${s}`,pref=TP[m][`${d}-${s}`];
    if(g[kc]||tb[kt]||pref==='c')continue;
    if((cd[`${c}-${d}-${m}`]||0)>=2||(td[`${m}-${d}`]||0)>=CFG.maxJour)continue;
    let sc=Math.random()*3+(pref==='p'?6:0);
    const day=SL.some((_,x)=>g[`${c}-${d}-${x}`]),near=g[`${c}-${d}-${s-1}`]||g[`${c}-${d}-${s+1}`];
    if(day&&!near)sc+=4;
    if(sc<bs){bs=sc;bk=[d,s]}
   }
   if(!bk){ok=false;break}
   const [d,s]=bk;g[`${c}-${d}-${s}`]=m;tb[`${m}-${d}-${s}`]=c;
   cd[`${c}-${d}-${m}`]=(cd[`${c}-${d}-${m}`]||0)+1;td[`${m}-${d}`]=(td[`${m}-${d}`]||0)+1;
  }
  if(!ok)continue;
  let pv=0,gaps=0;
  for(const k in g){const [c,d,s]=k.split('-');if(TP[g[k]][`${d}-${s}`]==='p')pv++}
  CLS.forEach(c=>{for(let d=0;d<5;d++){const idx=[];SL.forEach((_,s)=>{if(g[`${c}-${d}-${s}`])idx.push(s)});
   if(idx.length>1)for(let a=idx[0];a<idx[idx.length-1];a++)if(!g[`${c}-${d}-${a}`])gaps++}});
  const score=pv*5+gaps*2;
  if(!best||score<best.score)best={g,tb,pv,gaps,score};
 }
 return best}
const nbMarks=k=>{let n=0;for(const m in TP)for(const x in TP[m]){const [d,s]=x.split('-').map(Number);if(TP[m][x]===k&&okSlot(d,s))n++}return n};

R.edt=()=>{const r=S.role,fam=isFam(),dir=r==='dir',tm=(r==='prof'||r==='pp')?pm():null;
 const txt=tm?'Indique tes contraintes (obligatoires) et tes souhaits (si possible). Le générateur place d’abord les contraintes, puis le maximum de souhaits.':dir?'Le générateur respecte toutes les contraintes des professeurs, puis place un maximum de souhaits.':'Emploi du temps des classes.';

  h+=`<div class="card" style="margin-top:16px"><b>Mes contraintes et souhaits · ${M.n}</b><p class="small mute">Touche une case pour changer : libre → souhait → indisponible. Maximum ${CFG.maxJour} h par jour (réglé par la direction).</p>

  <p class="small mute">${nbMarks('c')?'':''}Le mercredi après-midi est fermé. Après tes modifications, la direction relance le générateur.</p></div>`}
 if(dir){h+=`<div class="card" style="margin-top:16px"><b>Contraintes et souhaits des professeurs</b><div class="scroll"><table><thead><tr><th>Matière</th><th>Professeur</th><th class="n">Contraintes</th><th class="n">Souhaits</th><th class="n">Heures / semaine / classe</th></tr></thead><tbody>${MATIERES.map(m=>{const v=Object.entries(TP[m.id]).filter(([k])=>{const [d,s]=k.split('-').map(Number);return okSlot(d,s)});return `<tr><td>${m.n}</td><td>${m.p}</td><td class="n">${v.filter(x=>x[1]==='c').length}</td><td class="n">${v.filter(x=>x[1]==='p').length}</td><td class="n">${HRS[m.id]} h</td></tr>`}).join('')}</tbody></table></div></div>`}
 if(!EDT)return h+`<div class="card" style="margin-top:16px">Aucun emploi du temps généré pour l’instant.</div>`;
 const ev=fam?'class:4A':S.ev;const [kind,id]=ev.split(':');
 const stat=dir||r==='vs'?`<div class="row" style="margin:12px 0"><span class="pill">0 conflit</span><span class="pill">Contraintes : 100 % respectées</span><span class="pill g">Souhaits respectés : ${nbMarks('p')-EDT.pv} / ${nbMarks('p')}</span><span class="pill ${EDT.gaps?'g':''}">${EDT.gaps} trou(s) dans les journées</span></div>`:'';
 h+=`<div class="card" style="margin-top:16px"><div class="row sp"><b>${fam?'Classe de 4A':'Emploi du temps généré'}</b>${fam?'':`<select id="edv" aria-label="Vue">${CLS.map(c=>`<option value="class:${c}" ${ev==='class:'+c?'selected':''}>Classe ${c}</option>`).join('')}${MATIERES.map(m=>`<option value="prof:${m.id}" ${ev==='prof:'+m.id?'selected':''}>${m.p} · ${m.n}</option>`).join('')}</select>`}</div>${stat}
 <div class="scroll"><table><thead><tr><th></th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${SL.map((l,s)=>{const row=`<tr><th>${l}</th>${DAYS.map((d,di)=>{if(!okSlot(di,s))return '<td></td>';let c='';
  if(kind==='class'){const m=EDT.g[`${id}-${di}-${s}`];if(m){const M=MATIERES.find(x=>x.id===m);c=`<b>${M.n}</b><div class="small mute">${M.p}</div>${!fam&&TP[m][`${di}-${s}`]==='p'?'<span class="pill g">souhait non respecté</span>':''}`}}
  else{const cl=EDT.tb[`${id}-${di}-${s}`];if(cl){c=`<b>Classe ${cl}</b>${TP[id][`${di}-${s}`]==='p'?'<div><span class="pill g">souhait non respecté</span></div>':''}`}else if(TP[id][`${di}-${s}`]==='c')c='<span class="pill r">indisponible</span>';else if(TP[id][`${di}-${s}`]==='p')c='<span class="pill">souhait respecté</span>'}
  return `<td style="white-space:normal;min-width:104px">${c}</td>`}).join('')}</tr>`;return s===3?row+`<tr><td colspan="6" class="small mute" style="text-align:center">Pause méridienne</td></tr>`:row}).join('')}</tbody></table></div></div>`;
 return h};

R.pedago=()=>{const m=pm(),M=MATIERES.find(x=>x.id===m),U=UNIT[m],us=PED[m];
 const all=us.flatMap((u,ui)=>u.s.map((s,si)=>({...s,ui,si,u:u.t})));const done=all.filter(s=>s.done).length;const next=all.filter(s=>!s.done).slice(0,3);const d=S.dup[m];

// ---------- Synchronisation des deux écrans ----------
const IS_SCREEN=new URLSearchParams(location.search).has('ecran');
let BC=null;try{BC=new BroadcastChannel('lc-conseil')}catch(err){}
function snap(){return {projI:S.projI,auto:S.auto,conseil:S.conseil,APPR,EV:Object.fromEntries(MATIERES.map(m=>[m.id,EVALS[m.id].map(e=>e.notes)])),OBS,COMP,coef:MATIERES.map(m=>m.c),CFG}}
function applySnap(s){S.projI=s.projI;S.auto=s.auto;S.conseil=s.conseil;for(const k in s.APPR)APPR[k]=s.APPR[k];MATIERES.forEach((m,x)=>{m.c=s.coef[x];EVALS[m.id].forEach((e,k)=>e.notes=s.EV[m.id][k])});OBS.splice(0,OBS.length,...s.OBS);COMP.splice(0,COMP.length,...s.COMP);Object.assign(CFG,s.CFG)}
function send(type){try{if(BC)BC.postMessage({type,s:type==='state'?snap():undefined})}catch(err){}}
let got=false,lastJ='';
function renderScreen(){$('#layer').innerHTML=got?projHTML(true):`<div class="proj" style="align-items:center;justify-content:center;text-align:center"><div><div class="big" style="font-size:clamp(36px,5vw,64px)">Luqmân Campus</div><p style="font-size:clamp(18px,2vw,26px);opacity:.8">En attente du professeur principal…</p><p class="small" style="opacity:.6">Ouvre « Pilotage du conseil » dans l’autre fenêtre.</p></div></div>`;if(got){startScroll();bindLayer()}}
function upd(){const el=$('#pstat');if(el){const ok=Date.now()-S.scr<12000;el.textContent=ok?'Écran projeté connecté':'Écran projeté non connecté';el.className='pill '+(ok?'':'r')}}
if(BC)BC.onmessage=ev=>{const m=ev.data;if(IS_SCREEN){if(m.type==='state'){const j=JSON.stringify(m.s);if(j===lastJ)return;lastJ=j;applySnap(m.s);got=true;renderScreen()}}else if(m.type==='hello'){S.scr=Date.now();send('state');upd()}};
if(!IS_SCREEN)setInterval(upd,3000);

function bindX(){
 $('#app').querySelectorAll('[data-comp]').forEach(s=>s.onchange=()=>{const [i,k]=s.dataset.comp.split('-').map(Number);COMP[i][k]=+s.value;s.className='cs lv'+s.value;const v=verdict(i);$('#cs-'+i).innerHTML=`<b>${compOk(i)}/8</b> <span class="pill ${v[1]}">${v[0]}</span>`;$('#cvalid').textContent=E.filter(e=>compOk(e.id)>=CFG.cycleN).length+'/'+E.length});
 $('#app').querySelectorAll('[data-cfg]').forEach(inp=>inp.onchange=()=>{const k=inp.dataset.cfg;CFG[k]=inp.type==='checkbox'?inp.checked:inp.type==='number'?parseFloat(inp.value):inp.value;logA(`Réglage « ${inp.closest('label').firstChild.textContent} » : ${CFG[k]===true?'oui':CFG[k]===false?'non':CFG[k]}`);saved()});
 $('#app').querySelectorAll('[data-coef]').forEach(inp=>inp.onchange=()=>{const m=MATIERES[+inp.dataset.coef];m.c=parseFloat(inp.value)||m.c;logA(`Coefficient ${m.n} : ${m.c}`);saved()});
 $('#app').querySelectorAll('[data-staff]').forEach(s=>s.onchange=()=>{const u=STAFF[+s.dataset.staff];u.r=s.value;logA(`Rôle de ${u.n} : ${ROLES.find(r=>r[0]===u.r)[1]}`);saved()});
 $('#app').querySelectorAll('[data-staffa]').forEach(c=>c.onchange=()=>{const u=STAFF[+c.dataset.staffa];u.a=c.checked;logA(`${u.n} : ${u.a?'activé':'désactivé'}`);saved()});
 const ev=$('#edv');if(ev)ev.onchange=()=>{S.ev=ev.value;render()};
 $('#app').querySelectorAll('[data-pj]').forEach(b=>b.onclick=()=>{S.projI=+b.dataset.pj;send('state');render()});
 const t=$('#pjtxt');if(t){let d=null;t.oninput=()=>{APPR.all[S.projI]=t.value;clearTimeout(d);d=setTimeout(()=>send('state'),350)}}
 upd();
}
function saved(){const el=$('#saved');if(el){el.textContent='Enregistré à '+now();el.className='pill'}const lb=$('#logbox');if(lb)lb.innerHTML=LOG.map(l=>`<span><b>${l.h}</b> · ${esc(l.t)}</span>`).join('')}

if(IS_SCREEN){document.body.classList.add('ecran');document.title='Luqmân Campus — écran conseil';renderScreen();send('hello');setInterval(()=>send('hello'),4000)}else{EDT=genEDT();render()}
}
</script>
</body>
</html>
